# Demo data for the dashboard. Edit and POST /run-pipeline to refresh.
#
# `trends_queries`: raw Google Trends rising queries (logged in Step 1, narration only)
# `trends`: category names the LLM "clusters" the queries into
# `products`: hand-curated CJ-style results. Each `category` must match
# one of the trends above. `cj_product_id` is the unique key.
#
# Steps 4 + 5 are computed automatically:
#   PURSUE  — margin_pct > 20  AND  supplier_risk_score > 70
#   AVOID   — margin_pct < 10  OR   supplier_risk_score < 40
#   MONITOR — anything in between
#
# Override the verdict on a specific product by adding
#   recommendation: PURSUE | MONITOR | AVOID
#   explanation: "your custom reason"

