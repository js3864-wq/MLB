# Demo input — fully offline mode (DEMO_MODE=true).
#
# Edit this file to control what the dashboard shows. The pipeline still runs
# end-to-end: Step 4 (margin math) and Step 5 (PURSUE/MONITOR/AVOID rules)
# are computed from the values you put here. No external API calls are made
# (no pytrends, no CJ Dropshipping, no LLM, no Supabase).
#
# - `trends`: list of category names. Replaces Step 1 (Google Trends + LLM).
# - `products`: list of products. Replaces Step 3 (CJ product search).
#   Each product's `category` must match one of the trends above.
#   `cj_product_id` is the unique key — change it across runs to add new rows,
#   keep it the same to overwrite an existing row.
#
# Recommendation rules (applied in Step 5, no LLM):
#   PURSUE  — margin_pct > 20  AND  supplier_risk_score > 70
#   AVOID   — margin_pct < 10  OR   supplier_risk_score < 40
#   MONITOR — anything in between
#
# You can override the verdict for a specific product by adding a
# `recommendation:` (PURSUE | MONITOR | AVOID) and optional `explanation:`.

trends:
  - ergonomic lumbar cushion
  - portable blender
  - pet grooming glove
  - magnetic phone mount
  - posture corrector brace

products:
